name: Build Kernel Opal + KSU

on:
  workflow_dispatch:
    inputs:
      KERNEL_SOURCE:
        description: 'Kernel source repo URL'
        required: true
        default: 'https://github.com/MiCode/Xiaomi_Kernel_OpenSource'
      KERNEL_BRANCH:
        description: 'Branch'
        required: true
        default: 'light'
      DEFCONFIG:
        description: 'Defconfig'
        required: true
        default: 'opal_defconfig'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python3

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            -b ${{ github.event.inputs.KERNEL_BRANCH }} \
            ${{ github.event.inputs.KERNEL_SOURCE }} \
            kernel-source

      - name: Setup KernelSU
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Clone Neutron Clang
        run: |
          mkdir clang
          curl -LO "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/09032023/neutron-clang-09032023.tar.zst"
          tar -I zstd -xf neutron-clang-09032023.tar.zst -C clang

      - name: Clone GCC
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            gcc64
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            gcc32

      - name: Build kernel
        run: |
          cd kernel-source

          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            ${{ github.event.inputs.DEFCONFIG }}

          make O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            -j$(nproc) 2>&1 | tee build.log

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3 \
            AnyKernel3

          cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ || \
          cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/ || \
          cp kernel-source/out/arch/arm64/boot/Image AnyKernel3/

          # Copy dtbo kalau ada
          cp kernel-source/out/arch/arm64/boot/dtbo.img AnyKernel3/ 2>/dev/null || true

          cd AnyKernel3
          zip -r9 \
            ../kernel-opal-ksu-$(date +%Y%m%d).zip \
            . \
            -x '*.git*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-opal-ksu
          path: |
            kernel-opal-ksu-*.zip
            kernel-source/build.log
          retention-days: 7
